[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpi"
version = "1.0.0"
description = "Jaipur Real Estate Price Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vedansh" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "lightgbm>=4.3.0,<5.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "slowapi>=0.1.9",
    "pyarrow>=15.0.0",
    "pandera>=0.18.0",
    "rapidfuzz>=3.6.0",
    "requests>=2.32.0",
    "joblib>=1.3.0",
    "optuna>=3.6.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "nbstripout>=0.7.0",
    "pip-audit>=2.7.0",
    "httpx>=0.27.0",
]
geo = [
    "osmnx>=1.9.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=src --cov=api --cov-report=term-missing"
